spring.application.name=ATF-Hackathon2026


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/atfdabase?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Johannesburg}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8081
spring.jpa.hibernate.ddl-auto=update
spring.mvc.problemdetails.enabled=true
spring.config.import=optional:file:./database.local.properties,optional:file:./exa.local.properties
